recommendation_policy:
  id: policy.recommendation.default_v0_7
  status: active
  title: Recommendation weights
  description: >
    Pure factor-weight map for policy-adjusted recommendations. Locked nodes
    are filtered out before scoring — hard prerequisites are a gate, not a
    weight, so no readiness factor appears here. Track names are opaque
    (decision 18): each node's track is looked up in track_weights; an
    unmapped track scores 0 and warns. Weights are the only mechanism —
    there are no boolean preference switches to disagree with them. v0.7
    supersedes the dormant `review_due` weight with the active
    `retention_urgency` factor (advisory sequencing, v2.1) and adds the
    opaque `agent_signal` factor for Phase 3/4 agent recommendations.
  factor_weights:
    track_priority: 3.0
    downstream_leverage: 2.0
    micro_session_fit: 1.0
    active_continuation: 2.0
    remediation_priority: 4.0
    retention_urgency: 2.0
    agent_signal: 1.5
    blocker_penalty: -3.0
  track_weights:
    foundational: 3.0
    core: 2.0
    consolidation: 2.0
    portfolio: 1.0
    remediation: 0.5
  created_at: 2026-07-04
  updated_at: 2026-09-08
