<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THROWAWAY — Operations workspace</title>
<style>
:root{--bg:#10151b;--panel:#171e26;--panel2:#1d2731;--line:#30404d;--text:#edf3f7;--muted:#9eafbc;--accent:#7dd3c7;--warn:#e9c46a;--ok:#8bd17c;--focus:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}button,a{font:inherit}button{cursor:pointer}.banner{padding:9px 18px;background:#5b2c06;color:#fff2df;text-align:center;font-weight:700;letter-spacing:.03em}.top{display:flex;align-items:center;gap:18px;padding:15px 22px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.08em}.mode{color:var(--muted)}.top .right{margin-left:auto;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 90px)}aside{padding:20px 14px;border-right:1px solid var(--line)}aside h2{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.12em;margin:8px 10px}.nav{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:11px 12px;border-left:3px solid transparent}.nav.active{background:var(--panel2);color:var(--text);border-color:var(--accent)}.main{padding:25px;max-width:1450px}h1{font-size:27px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 7px}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,minmax(150px,1fr))}.card{background:var(--panel);border:1px solid var(--line);padding:15px}.value{font-size:25px;font-weight:750}.label,.tiny{font-size:12px;color:var(--muted)}.stack{margin-top:20px;background:var(--panel);border:1px solid var(--line)}.row{display:grid;grid-template-columns:1.25fr 1fr 1fr auto;gap:14px;align-items:center;padding:13px 15px;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row.header{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.pill{font-size:12px;border:1px solid var(--line);padding:3px 8px;white-space:nowrap}.ok{color:var(--ok);border-color:#416b48}.warn{color:var(--warn);border-color:#705c32}.link{color:var(--accent);text-decoration:none}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:20px}.inspector{background:var(--panel2);border:1px solid var(--line);padding:17px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.fact{border-top:1px solid var(--line);padding-top:9px}.fact strong{display:block;font-size:12px;color:var(--muted);font-weight:500}.fact em{font-style:normal}.empty{padding:18px;border:1px dashed var(--line);color:var(--muted);margin-top:14px}.switch{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#f2f7f8;color:#111b22;padding:7px 9px;border-radius:8px;box-shadow:0 4px 18px #0008;z-index:3}.switch button{border:0;background:transparent;color:#111b22;font-size:20px;padding:0 6px}.switch strong{min-width:230px;text-align:center;font-size:13px}.controls{display:flex;gap:8px;margin:0 0 18px}.controls button{background:var(--panel2);color:var(--muted);border:1px solid var(--line);padding:6px 10px}.controls button[aria-pressed=true]{color:var(--text);border-color:var(--accent)}a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.section-link{margin:0 0 20px;padding:15px;background:var(--panel);border:1px solid var(--line)}.section-link a{margin-right:16px}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.mini{padding:16px;background:var(--panel);border:1px solid var(--line)}.mini ul{padding-left:18px;color:var(--muted)}@media(max-width:800px){.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px}.layout aside h2{display:none}.nav{display:inline-block;width:auto;border-left:0;border-bottom:3px solid transparent}.nav.active{border-bottom-color:var(--accent)}.cards{grid-template-columns:repeat(2,1fr)}.split,.mini-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row.header{display:none}.switch{left:10px;right:10px;transform:none;justify-content:space-between}.switch strong{min-width:0}}
</style>
</head>
<body>
<div class="banner">THROWAWAY DECISION AID — Operations workspace alternatives — not production UI</div>
<header class="top"><span class="brand">SKILLTRACE</span><span class="mode">Operations mode</span><span class="right">Prototype state: <span id="stateLabel">seeded</span></span></header>
<div class="layout" id="layout"></div>
<div class="switch" aria-label="Prototype variant switcher"><button id="prev" aria-label="Previous variant">←</button><strong id="label">A — Persistent workspace shell</strong><button id="next" aria-label="Next variant">→</button></div>
<script>
const seeded={counts:{nodes:100,available:49,locked:51,sessions:8,evidence:12,reviews:3},graph:[['agents.agent_fundamentals_01','Available','10 downstream'],['data.pandas_foundations','Available','6 downstream'],['math.calculus','Locked','—'],['programming.python_async','Available','5 downstream']],facts:['Available nodes','Locked nodes','Session records','Evidence records','Review records'],labels:['49','51','8','12','3']};
const limited={counts:{nodes:3,available:1,locked:2,sessions:1,evidence:0,reviews:0},graph:[['agents.agent_fundamentals_01','Available','10 downstream'],['math.calculus','Locked','—'],['programming.python_async','Locked','—']],facts:['Available nodes','Locked nodes','Session records','Evidence records','Review records'],labels:['1','2','1','0','0']};
let variant='A', data=seeded;
function rows(){return data.graph.map(row=>`<div class="row"><strong>${row[0]}</strong><span class="pill ${row[1]==='Available'?'ok':'warn'}">${row[1]}</span><span>${row[2]}</span><a class="link" href="#inspect">Inspect →</a></div>`).join('')}
function shell(){return `<aside><h2>Operations</h2><button class="nav active" data-view="Graph">Graph</button><button class="nav" data-view="Evidence">Evidence</button><button class="nav" data-view="Reviews">Reviews</button><button class="nav" data-view="Analytics">Analytics</button><button class="nav" data-view="Portfolio">Portfolio</button><h2>Context</h2><button class="nav" data-view="Health">Health</button></aside><main class="main"><h1>Operations workspace</h1><p class="sub">Inspection surfaces for canonical engine facts. Learner guidance remains in Guided mode.</p><div class="controls"><button data-data="seeded" aria-pressed="true">Seeded fixture</button><button data-data="limited" aria-pressed="false">Limited fixture</button></div><div class="grid cards">${data.facts.map((f,i)=>`<div class="card"><div class="label">${f}</div><div class="value">${data.labels[i]}</div></div>`).join('')}</div><section class="stack" id="inspect"><div class="row header"><span>SkillNode</span><span>Readiness</span><span>Graph context</span><span></span></div>${rows()}</section><div class="split"><section class="inspector"><h2>Selected SkillNode</h2><p class="tiny">agents.agent_fundamentals_01</p><div class="facts"><div class="fact"><strong>Readiness</strong><em>available</em></div><div class="fact"><strong>Unlocks</strong><em>10 downstream</em></div><div class="fact"><strong>Evidence</strong><em>2 records</em></div><div class="fact"><strong>Pass status</strong><em>learner-initiated</em></div></div><p><a class="link" href="#detail">Open node detail →</a></p></section><section class="inspector"><h2>What this surface does not claim</h2><div class="empty">No telemetry, streak, score, or inferred learner state is shown. Empty analytics explain their derivation and link to the engine view.</div></section></div></main>`}
function sections(){return `<main class="main" style="grid-column:1/-1"><h1>Operations</h1><p class="sub">A capability directory. Each destination owns its own route and history; the learner is never buried in a persistent tool chrome.</p><div class="controls"><button data-data="seeded" aria-pressed="true">Seeded fixture</button><button data-data="limited" aria-pressed="false">Limited fixture</button></div><div class="section-link"><a class="link" href="#graph">Graph</a><a class="link" href="#evidence">Evidence</a><a class="link" href="#reviews">Reviews</a><a class="link" href="#analytics">Analytics</a><a class="link" href="#portfolio">Portfolio</a><a class="link" href="#health">Health</a></div><div class="mini-grid"><section class="mini" id="graph"><h2>Graph</h2><div class="value">100 nodes</div><p class="tiny">49 available · 51 locked</p><a class="link" href="#graph-detail">Explore graph →</a></section><section class="mini" id="evidence"><h2>Evidence</h2><div class="value">12 records</div><p class="tiny">Immutable records, corrections, and supersessions.</p><a class="link" href="#evidence-detail">Inspect evidence →</a></section><section class="mini" id="reviews"><h2>Reviews</h2><div class="value">3 records</div><p class="tiny">Review records are distinct from learner suggestions.</p><a class="link" href="#reviews-detail">Inspect reviews →</a></section><section class="mini" id="analytics"><h2>Analytics</h2><div class="value">4 themes</div><p class="tiny">Derived facts only; no fake telemetry.</p><a class="link" href="#analytics-detail">Open analytics →</a></section><section class="mini" id="portfolio"><h2>Portfolio</h2><div class="value">Export</div><p class="tiny">Redacted, disposable export only.</p><a class="link" href="#portfolio-detail">Prepare export →</a></section><section class="mini" id="health"><h2>Health</h2><div class="value">Check</div><p class="tiny">Engine liveness and source consistency, not a learner score.</p><a class="link" href="#health-detail">Open health →</a></section></div></main>`}
function render(){document.querySelector('#layout').innerHTML=variant==='A'?shell():`<aside style="display:none"></aside>${sections()}`;document.querySelector('#label').textContent=variant==='A'?'A — Persistent workspace shell':'B — Capability sections and links';document.querySelector('#stateLabel').textContent=data===seeded?'seeded':'limited';document.querySelectorAll('[data-data]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.data===(data===seeded?'seeded':'limited')));document.querySelectorAll('[data-data]').forEach(b=>b.onclick=()=>{data=b.dataset.data==='seeded'?seeded:limited;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}
function cycle(step){variant=variant==='A'?'B':'A';render()}document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});render();
</script>
</body>
</html>
