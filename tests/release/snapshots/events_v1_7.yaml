# Snapshot of the v1.7 event-log schema (SA1, spec §9.2).
#
# The event log is audit-only: every mutating command appends one event and
# events are never read to compute state (CONTEXT.md, AGENTS.md). The
# portfolio builder derives from the primary truth files directly (§1), so
# this schema stays frozen — any added, renamed, or removed key fails SA1
# with the diff as the message. The `portfolio export` audit event uses the
# same four record keys via the dispatcher; no new event shape ships in v2.0.
top_level_keys:
- events
record_keys:
- args
- command
- records_touched
- timestamp
