smoke_test_plan:
  id: smoke.skill_graph_v1
  title: Skill Graph v1.0 read-only smoke tests
  description: Read-only tests proving the package validates, presents health/today/recommendation
    views, and enforces policy boundaries (5-layer engine, scaffold archived per ADR 0005).
  platform: cross_platform
  steps:
  - order: 1
    title: Validate graph
    command: skilltrace validate graph
    expected_output_contains:
    - 'validate graph: OK'
    mutates_files: false
    required: true
  - order: 2
    title: Validate evidence
    command: skilltrace validate evidence
    expected_output_contains:
    - 'validate evidence: OK'
    mutates_files: false
    required: true
  - order: 3
    title: Validate execution
    command: skilltrace validate execution
    expected_output_contains:
    - 'validate execution: OK'
    mutates_files: false
    required: true
  - order: 4
    title: Validate policy
    command: skilltrace validate policy
    expected_output_contains:
    - 'validate policy: OK'
    mutates_files: false
    required: true
  - order: 5
    title: System health
    command: skilltrace health
    expected_output_contains:
    - 'healthy'
    mutates_files: false
    required: true
  - order: 6
    title: Today view
    command: skilltrace today
    expected_output_contains:
    - 'Today'
    mutates_files: false
    required: true
  - order: 7
    title: Recommendation
    command: skilltrace next --minutes 60 --limit 5 --show-locked
    expected_output_contains:
    - 'next'
    mutates_files: false
    required: true
  - order: 8
    title: Automation boundary
    command: skilltrace check-automation pass_node
    expected_output_contains:
    - 'Permission: forbidden'
    mutates_files: false
    required: true
  created_at: '2026-06-28'
  updated_at: '2026-08-21'
